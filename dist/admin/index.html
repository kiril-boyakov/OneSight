<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review management — OneSight</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/reviews.css"><script defer src="/admin/reviews.js"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2"><link rel="icon" type="image/svg+xml" href="/onesight-favicon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"></head>
<body><main class="review-admin"><a class="text-link" href="/">Back to OneSight</a><h1>Review management</h1><p>Approve genuine client feedback before it appears on your website.</p><p id="admin-status" role="status" aria-live="polite">Checking connection…</p>
<form id="admin-login"><fieldset id="login-fields" disabled><legend>Owner sign in</legend><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button" type="submit">Sign in</button></fieldset></form>
<section id="moderation" hidden><div class="admin-toolbar"><label>Show<select id="review-filter"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></label><button class="button" id="logout" type="button">Sign out</button></div><div id="moderation-list"></div></section></main></body></html>
